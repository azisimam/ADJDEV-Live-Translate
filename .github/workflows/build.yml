name: Build ADJDEV Live Translate

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find ZIP project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          echo "Project berhasil diekstrak."

      - name: Find Gradle project
        shell: bash
        run: |
          # Coba beberapa penanda root project Gradle, urut prioritas
          GRADLE_FILE=$(find project -type f -name "settings.gradle.kts" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "settings.gradle.kts tidak ditemukan, coba settings.gradle..."
            GRADLE_FILE=$(find project -type f -name "settings.gradle" | head -n 1)
          fi

          if [ -z "$GRADLE_FILE" ]; then
            echo "settings.gradle tidak ditemukan, coba build.gradle.kts..."
            GRADLE_FILE=$(find project -type f -name "build.gradle.kts" -not -path "*/app/*" | head -n 1)
          fi

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: project Gradle tidak ditemukan (sudah coba settings.gradle.kts, settings.gradle, build.gradle.kts)."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Gradle
        run: |
          java -version
          gradle --version

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Mencari APK..."

          find "${PROJECT_DIR}" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADJDEV-Live-Translate-debug
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
